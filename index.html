<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CORE SYSTEM</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<!-- =====================
     后台密码页面
===================== -->


<div class="panel" id="loginPanel">


<h1>
AI CORE
</h1>


<div class="subtitle">
SYSTEM LOGIN
</div>



<input 
type="password"
id="password"
placeholder="ENTER PASSWORD"
>



<button onclick="login()">

ACCESS SYSTEM

</button>


<div id="loginError"></div>


</div>





<!-- =====================
     AI后台输入页面
===================== -->


<div class="panel hidden" id="adminPanel">


<h1>

AI CORE

</h1>


<div class="subtitle">

PREDICTION CONTROL PANEL

</div>



<label>

TARGET NAME

</label>


<input 
id="target"
placeholder="输入目标名称"
>




<label>

INPUT DATA

</label>


<input 
id="number"
placeholder="输入数字"
>



<label>

SUCCESS RATE %

</label>


<input 
id="rate"
value="95.8"
>



<button onclick="createShare()">

GENERATE AI LINK

</button>



<div id="linkBox"></div>


</div>






<!-- =====================
     AI运行页面
===================== -->


<div id="screen" class="hidden">



<div class="header">


<div>

AI CORE ONLINE

</div>


<div id="status">

RUNNING...

</div>


</div>





<div class="targetBox">


TARGET:

<br>


<span id="targetShow">

</span>


</div>






<div class="terminal" id="code">


</div>





<div class="progressBox">


<div id="progress">


</div>


</div>






<div id="result">


</div>




</div>







<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>


<script src="firebase.js"></script>

<script src="script.js"></script>



</body>


</html>
