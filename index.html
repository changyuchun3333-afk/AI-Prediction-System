<!DOCTYPE html>
<html>
<head>

<div class="panel" id="inputPanel">

</option>

</button>

<div>> INITIALIZING AI CORE...</div>

</div>

</div>


<div id="result">

</div>


</div>



<script src="script.js"></script>

</body>
</html>
